name: telegram bot

on:
  schedule:
    - cron: "*/30 * * * *" # one live run at a time; the queue keeps it ~24/7
  workflow_dispatch:

concurrency:
  group: telegram-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # GitHub's per-job ceiling is 360
    steps:
      - uses: actions/checkout@v4

      - name: Gate on the bot token
        id: gate
        run: |
          if [ -z "${{ secrets.TELEGRAM_BOT_TOKEN }}" ]; then
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::notice::TELEGRAM_BOT_TOKEN secret is not set. Add it in Settings -> Secrets and variables -> Actions to bring the bot online."
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.has_token == 'true'
        with:
          python-version: "3.12"

      - name: Install woyo
        if: steps.gate.outputs.has_token == 'true'
        run: pip install ".[search,extract,files,docs]" # from this checkout — the bot always runs the code it ships with

      - name: Run the bot (state synced to a private repo)
        if: steps.gate.outputs.has_token == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          BOT_STATE_REPO: ${{ secrets.BOT_STATE_REPO }}
          BOT_STATE_TOKEN: ${{ secrets.BOT_STATE_TOKEN }}
          WOYO_PROVIDER: cohere
          WOYO_MODEL: command-a-03-2025
          WOYO_TIMEZONE: Africa/Algiers
          WOYO_ENABLE_CODE_EXEC: "true" # python_exec + workspace files
          WOYO_ENABLE_SHELL: "true"     # terminal — every call still needs a button-press approval
          WOYO_ROTATE_AFTER_MIN: "290"   # self-rotate safely under the 350-min job ceiling; the bot dispatches its own successor
          WOYO_VISION_MODEL: "openrouter:dots-studio/dots-3-note-preview:free,openrouter:qwen/qwen3.8-27b:free" # photos -> free vision models, tried in order (needs OPENROUTER_API_KEY)
        run: python deploy/gha-telegram/run_bot.py
